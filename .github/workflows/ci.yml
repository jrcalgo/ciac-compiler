name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  generated-python:
    name: Validate generated Python projects (all examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Verify every example
        run: |
          set -euo pipefail
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-py-$name"
            echo "::group::$name"
            cargo run -q -p ciac -- verify "$src" --target python --out "$out"
            echo "::endgroup::"
          done

  generated-rust:
    name: Validate generated Rust projects (all examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Verify every example
        run: |
          set -euo pipefail
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-rs-$name"
            echo "::group::$name"
            cargo run -q -p ciac -- verify "$src" --target rust --out "$out"
            echo "::endgroup::"
          done
