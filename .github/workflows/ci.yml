name: CI

on:
  push:
    # `claude/**` covers the active development branches (v0.13 M1):
    # before this, CI only ever ran on main/PRs — meaning pushes to
    # working branches carried zero CI signal and the "runs in CI"
    # claims for Docker-dependent verification never executed.
    branches: [main, "claude/**"]
  pull_request:
  # 26UpdatePlan.md M6: template pins and the compiler's own dependency
  # tree age between pushes -- a weekly run means both scanners still
  # fire even on a quiet week, so a newly-published advisory is caught
  # within days rather than at the next incidental push.
  schedule:
    - cron: "0 6 * * 1"

# Every job here only reads the repo and reports check results — no job
# needs to write back (contrast release.yml/language-release.yml, which
# scope `contents: write` to the one job that actually publishes).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 24UpdatePlan.md M1: `ciac-backend-go::generate()` shells out to
      # the real `gofmt` binary so generated `.go` bytes are canonical
      # by construction rather than a template-layer approximation
      # (see that crate's own `render_go` doc comment) -- `cargo test
      # --workspace` now needs Go on `PATH` for that reason alone, not
      # only for the dedicated `generated-go` job below.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: cargo test --workspace
      # 30UpdatePlan.md M8: the codegen speed instrument, printed every
      # run as information — not a gate. `tests/tests/perf_budget.rs`
      # (part of `cargo test --workspace` above) is the actual gate;
      # this step exists so a human glancing at CI can see the real
      # per-target numbers without re-running the sweep locally.
      # `continue-on-error` so a script hiccup never blocks a merge —
      # the budget test above is what's allowed to fail the build.
      - name: Codegen speed (informational)
        continue-on-error: true
        run: scripts/bench-codegen.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # 26UpdatePlan.md M6: the compiler's own dependency tree, scanned
  # against RustSec (advisories) and cargo-deny's broader policy
  # (licenses/bans/sources). Runs on every push (fast: no example
  # generation) and again on the weekly `schedule:` trigger above so
  # newly-published advisories are caught between pushes.
  workspace-audit:
    name: Workspace dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit + cargo-deny (pinned)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
      - name: Verify deny.toml ignore entries carry reason + unexpired expiry
        run: ./scripts/check-deny-ignores.sh deny.toml

  # 26UpdatePlan.md M6: the novel half of this pillar -- scanning what
  # users *inherit*, not just this repo's own tree. Builds the flagship
  # `order-system` (+ `kafka-pipeline` for the divergent broker trees)
  # for all five targets and runs each ecosystem's own scanner against
  # the generated project's resolved dependencies. A finding here is
  # fixed by bumping the pin in the *template*, which the goldens then
  # show to every reviewer and the next release ships to every user.
  generated-audit:
    name: Generated-project dependency audit (5 ecosystems)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Generate the representative projects
        run: |
          set -euo pipefail
          for target in python rust typescript go java; do
            cargo run -q -p ciac -- verify examples/order-system.ciac --target "$target" --out "/tmp/audit-order-system-$target"
            cargo run -q -p ciac -- verify examples/kafka-pipeline.ciac --target "$target" --out "/tmp/audit-kafka-pipeline-$target"
          done
      - name: pip-audit (Python)
        run: |
          set -euo pipefail
          for proj in /tmp/audit-order-system-python /tmp/audit-kafka-pipeline-python; do
            [ -d "$proj" ] || continue
            (cd "$proj" && pip-audit --strict -r requirements.txt)
          done
      - name: cargo audit (Rust)
        run: |
          set -euo pipefail
          for proj in /tmp/audit-order-system-rust /tmp/audit-kafka-pipeline-rust; do
            [ -d "$proj" ] || continue
            (cd "$proj" && cargo generate-lockfile && cargo audit)
          done
      - name: npm audit (TypeScript)
        run: |
          set -euo pipefail
          for proj in /tmp/audit-order-system-typescript /tmp/audit-kafka-pipeline-typescript; do
            [ -d "$proj" ] || continue
            (cd "$proj" && npm install --package-lock-only && npm audit --audit-level=high)
          done
      - name: govulncheck (Go)
        run: |
          set -euo pipefail
          for proj in /tmp/audit-order-system-go /tmp/audit-kafka-pipeline-go; do
            [ -d "$proj" ] || continue
            (cd "$proj" && govulncheck ./...)
          done
      - name: grype (Java, resolved classpath)
        run: |
          set -euo pipefail
          for proj in /tmp/audit-order-system-java /tmp/audit-kafka-pipeline-java; do
            [ -d "$proj" ] || continue
            (cd "$proj" && ./mvnw -q -B dependency:build-classpath -Dmdep.outputFile=/dev/stdout)
            grype "dir:$proj" --fail-on high
          done

  # Makes vendor-copy drift a hard CI failure instead of something only
  # caught the next time someone happens to run `cargo test
  # --workspace` locally (the vendored_sim_matches_source /
  # vendored_pyrunner_matches_source / vendored_examples_match_source
  # tests next to each include_str! still exist and still guard the
  # same thing inside a normal workspace build -- this job removes the
  # "only if someone runs the tests" gap by re-running the same sync
  # scripts a human would run to fix drift and failing the build if
  # that changes anything).
  vendor-sync:
    name: Vendored copies match their canonical sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Re-sync and check for drift
        run: |
          set -euo pipefail
          scripts/sync-vendored-sim.sh
          scripts/sync-vendored-ciac-assets.sh
          if ! git diff --exit-code -- crates/ciac-backend-rust/vendor crates/ciac/vendor crates/ciac-syntax/vendor; then
            echo "::error::a vendored copy is stale -- run the sync script(s) above locally and commit the result"
            exit 1
          fi

  generated-python:
    name: Validate generated Python projects (all examples)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Verify every example
        run: |
          set -euo pipefail
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-py-$name"
            echo "::group::$name"
            cargo run -q -p ciac -- verify "$src" --target python --out "$out"
            echo "::endgroup::"
          done

  generated-rust:
    name: Validate generated Rust projects (all examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Verify every example
        run: |
          set -euo pipefail
          # One shared target dir for every generated project: 17
          # examples x a full Axum/SQLx dep tree each exhausted the
          # runner's disk (v0.13 M1's first-ever run of this job);
          # sharing compiles the deps once and fits comfortably.
          export CARGO_TARGET_DIR=/tmp/gen-rs-shared-target
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-rs-$name"
            echo "::group::$name"
            # A CIAC0011-gated example (a provider this target doesn't
            # implement yet) is a disclosed skip, not a failure — any
            # other verify failure still fails the job (v0.13 M1).
            if ! output="$(cargo run -q -p ciac -- verify "$src" --target rust --out "$out" 2>&1)"; then
              if grep -q "CIAC0011" <<<"$output"; then
                echo "skipped: gated on this target"
              else
                echo "$output"
                exit 1
              fi
            else
              echo "$output"
            fi
            echo "::endgroup::"
          done

  # v0.23 M8: TypeScript reached full provider parity this arc
  # (`TsBackend::supports` is now the same unconditional `true` Rust's
  # own is) -- every example verifies, so this job has no CIAC0011-
  # skip branch to carry, unlike `generated-rust` above.
  generated-typescript:
    name: Validate generated TypeScript projects (all examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Verify every example
        run: |
          set -euo pipefail
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-ts-$name"
            echo "::group::$name"
            cargo run -q -p ciac -- verify "$src" --target typescript --out "$out"
            echo "::endgroup::"
            # 26 examples x a full npm dependency tree each would
            # exhaust the runner's disk (the same failure mode
            # `generated-rust`'s shared CARGO_TARGET_DIR comment
            # already discloses for its own dep tree) -- node_modules
            # is npm-cached by actions/setup-node above, so removing
            # the installed copy after each example still leaves
            # subsequent installs fast.
            rm -rf "$out/node_modules" "$out"/*/node_modules
          done

  # 24UpdatePlan.md M1: Go's `supports()` is narrow (apis only) this
  # milestone, so most examples are a disclosed CIAC0011 skip -- the
  # same pattern `generated-rust` above already carries for its own
  # still-gated capabilities, not a Go-specific workaround. Widens
  # example by example as later milestones un-gate more of
  # `supports()`, same as every other target's own history here.
  generated-go:
    name: Validate generated Go projects (all examples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # v0.24 M8: keyed on the single checked-in go.sum.pin every
      # generated project copies verbatim (`ciac-backend-go::lib.rs`'s
      # own `GO_SUM` constant) rather than a repo-root go.sum (this
      # repo has none) -- every generated project across every example
      # this job iterates shares the exact same dependency set, so one
      # cache entry keyed on that one file covers all of them.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: crates/ciac-backend-go/templates/go.sum.pin
      - name: Build the compiler
        run: cargo build -p ciac
      # v0.24 M8: every example now reaches Go (`supports()` is
      # unconditional `true` as of M7) -- the CIAC0011 skip branch
      # below is kept for the same reason Rust's/TS's own equivalent
      # jobs keep theirs (a future capability could reintroduce a real
      # gate), not because anything is expected to hit it today.
      - name: Verify every example
        run: |
          set -euo pipefail
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-go-$name"
            echo "::group::$name"
            if ! output="$(cargo run -q -p ciac -- verify "$src" --target go --out "$out" 2>&1)"; then
              if grep -q "CIAC0011" <<<"$output"; then
                echo "skipped: gated on this target"
              else
                echo "$output"
                exit 1
              fi
            else
              echo "$output"
            fi
            echo "::endgroup::"
          done

  # 25UpdatePlan.md M8: the full 26-example matrix, unscoped — the
  # M5 CHECKPOINT's own pre-agreed CI-scoping decision, taken from
  # real measured numbers (`./mvnw -q -B verify` ~10s/project,
  # dominated by JVM+Maven-plugin startup, not compile/test volume),
  # not deferred or improvised here: the full matrix stays comfortably
  # inside typical CI budgets, so the narrowing clause this decision
  # could have invoked never triggers. Mirrors `generated-go`'s own
  # shape exactly, including its CIAC0011-skip branch (kept for the
  # same reason: a future capability could reintroduce a real gate,
  # not because anything is expected to hit it today — zero gates as
  # of `26UpdatePlan.md` M3, which closed the one gate M7 missed:
  # `Component::Logging` stayed CIAC0011-refused through v0.25 despite
  # this backend's own module doc already claiming support).
  generated-java:
    name: Validate generated Java projects (all examples)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the compiler
        run: cargo build -p ciac
      - name: Verify every example
        run: |
          set -euo pipefail
          for src in examples/*.ciac; do
            name="$(basename "$src" .ciac)"
            out="/tmp/gen-java-$name"
            echo "::group::$name"
            if ! output="$(cargo run -q -p ciac -- verify "$src" --target java --out "$out" 2>&1)"; then
              if grep -q "CIAC0011" <<<"$output"; then
                echo "skipped: gated on this target"
              else
                echo "$output"
                exit 1
              fi
            else
              echo "$output"
            fi
            echo "::endgroup::"
          done

  # v0.17 M12: `ciac verify --sim` runs the checked-in scenarios against
  # real generated code through in-memory fakes — no Docker, no
  # network. Scoped to the examples with checked-in scenario coverage
  # today (see docs/simulation.md); writing scenarios for every other
  # example is real, disclosed future work, not attempted here. The
  # trailing `docker ps -aq` check is a real regression guard, not
  # decoration: if simulation ever starts a container, this job fails
  # immediately instead of the claim boundary silently eroding.
  generated-sim:
    name: Simulate checked-in scenarios (no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build the compiler
        run: cargo build -p ciac
      - name: verify --sim against the checked-in scenarios
        run: |
          set -euo pipefail
          cargo run -q -p ciac -- verify examples/sim-vertical-slice.ciac \
            --target python --out /tmp/gen-sim-vertical-slice --sim \
            --scenario sim/vertical-slice.ciac-sim.json \
            --scenario sim/virtual-week.ciac-sim.json
          # 27UpdatePlan.md M2: the relational-depth/atomic-batch/fanout
          # corpus. M4-M8 grew Rust/TypeScript/Go/Java to the identical
          # full-parity worlds these scenarios exercise on Python, but
          # this job stayed Python-only rather than growing 5x here too
          # -- `scripts/sim-corpus-x5.sh` (not CI-invoked, run on demand)
          # is the arc's actual cross-target conformance oracle per its
          # own Verification strategy table; this job's job is a fast
          # per-PR smoke check, not a second copy of that harness.
          cargo run -q -p ciac -- verify examples/domain-orders.ciac \
            --target python --out /tmp/gen-sim-domain-orders --sim \
            --scenario sim/relational-depth.ciac-sim.json \
            --scenario sim/atomic-batch.ciac-sim.json
          cargo run -q -p ciac -- verify examples/sim-broker-slice.ciac \
            --target python --out /tmp/gen-sim-broker-slice --sim \
            --scenario sim/fanout.ciac-sim.json
          # 27UpdatePlan.md M3: the cache-ttl/peripherals/http-fixtures/
          # auth-scopes corpus, exercising the peripheral fakes (cache
          # TTL, object store, email, search, external HTTP fixtures,
          # auth claims/scopes) added this milestone -- Python-only for
          # now, same as M2's own row above.
          cargo run -q -p ciac -- verify examples/sim-peripherals.ciac \
            --target python --out /tmp/gen-sim-peripherals --sim \
            --scenario sim/cache-ttl.ciac-sim.json \
            --scenario sim/peripherals.ciac-sim.json \
            --scenario sim/http-fixtures.ciac-sim.json \
            --scenario sim/auth-scopes.ciac-sim.json
          # 27UpdatePlan.md M9: query-verbs.ciac (the db.update/query/
          # count/delete_where predicate closure) and order-system.ciac
          # (the flagship every M4-M8 Shipped note named as refused,
          # now green) -- the two examples this milestone's own
          # FakeDatabase/_FakeSession closure made sim-reachable.
          cargo run -q -p ciac -- verify examples/query-verbs.ciac \
            --target python --out /tmp/gen-sim-query-verbs --sim \
            --scenario sim/query-verbs.ciac-sim.json
          cargo run -q -p ciac -- verify examples/order-system.ciac \
            --target python --out /tmp/gen-sim-order-system --sim \
            --scenario sim/order-system.ciac-sim.json
          # 28UpdatePlan.md M9: the three multi-service corpus
          # scenarios, exercising the shared-world call router and
          # per-service table namespacing this arc's own M2 built --
          # Python-only for now, same as every other row in this job;
          # `scripts/sim-corpus-x5.sh` (not CI-invoked, run on demand)
          # is the arc's actual cross-target conformance oracle, same
          # split every earlier milestone's own row already follows.
          cargo run -q -p ciac -- verify examples/sim-three-service.ciac \
            --target python --out /tmp/gen-sim-three-service --sim \
            --scenario sim/sim-three-service.ciac-sim.json
          cargo run -q -p ciac -- verify examples/multi-service-media.ciac \
            --target python --out /tmp/gen-sim-multi-service-media --sim \
            --scenario sim/multi-service-media.ciac-sim.json
          cargo run -q -p ciac -- verify examples/inventory-system.ciac \
            --target python --out /tmp/gen-sim-inventory-system --sim \
            --scenario sim/inventory-system.ciac-sim.json
          # 29UpdatePlan.md M3: the README's own walkthrough example --
          # verified here on the same footing as every other checked-in
          # scenario, so the README's `ciac sim` block can never drift
          # from a scenario that actually passes.
          cargo run -q -p ciac -- verify examples/quickstart.ciac \
            --target python --out /tmp/gen-sim-quickstart --sim \
            --scenario sim/quickstart.ciac-sim.json
      - name: assert no Docker container was started
        run: |
          set -euo pipefail
          if [ -n "$(docker ps -aq)" ]; then
            echo "simulation started a container -- this breaks the no-Docker claim boundary"
            docker ps -a
            exit 1
          fi

  # 29UpdatePlan.md M4: the guide-veracity harness. Every runnable
  # block in the README and docs/guide/*.md is extracted and executed
  # for real against the real binary -- documentation that lies about
  # a command is the one bug class this arc can introduce, so it gets
  # an oracle, the same way generated code does.
  check-guides:
    name: Guide veracity (README + docs/guide/*.md)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: run the harness
        run: scripts/check-guides.sh

  # v0.9 M5: `ciac verify --system` actually runs, automatically — a
  # real `docker compose up`, the generated tests/system/ suite (call
  # reachability, broker delivery, channels, capability round-trips)
  # against real containers, and a guaranteed teardown. Scoped to the
  # system-bearing examples (not all of them) per the CI-time-budget
  # risk in 09UpdatePlan.md; between them they exercise every generated
  # system-test kind at least once. ubuntu-latest runners ship Docker +
  # compose, so no extra setup step is needed.
  generated-system:
    name: System-verify multi-service examples (compose-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the compiler
        run: cargo build -p ciac
      # Python covers all three system-bearing examples; Rust covers
      # only the smallest (a compose build of a Rust service compiles
      # its whole crate tree inside an uncached container — running the
      # 5-service media system that way would blow the job's time
      # budget for no additional system-test coverage). v0.24 M7: Go
      # gets the same three rows TS's own M7 added, *plus*
      # multi-service-media — Go's own compose build compiles a
      # `go build` inside an uncached container in low single-digit
      # seconds (no crate-tree-style recompile cost the way Rust's
      # does), so the 5-service system fits comfortably inside this
      # job's time budget where it didn't for Rust.
      - name: System-verify each target
        run: |
          set -euo pipefail
          run_system() {
            local src="$1" target="$2"
            local name; name="$(basename "$src" .ciac)"
            local out="/tmp/gen-system-$target-$name"
            echo "::group::$name ($target)"
            cargo run -q -p ciac -- verify "$src" --target "$target" --out "$out" --system
            echo "::endgroup::"
          }
          run_system examples/multi-service-media.ciac python
          run_system examples/multi-service-media.ciac go
          run_system examples/audited-crud.ciac python
          run_system examples/inventory-system.ciac python
          run_system examples/inventory-system.ciac rust
          run_system examples/inventory-system.ciac typescript
          run_system examples/inventory-system.ciac go
          run_system examples/mysql-notes.ciac python
          run_system examples/mysql-notes.ciac rust
          run_system examples/mysql-notes.ciac typescript
          run_system examples/mysql-notes.ciac go
          run_system examples/kafka-pipeline.ciac python
          # v0.17 M11's fidelity ratchet, all four narrow/full sim
          # targets as of v0.24 M9: the same broker-publish effect each
          # target's own sim_runner (no Docker) exercises against its
          # SimWorld/World fake queue is exercised here against a real
          # NATS broker + real Postgres, via the generated tests/system/
          # test_delivery.py capability round-trip (v0.9 M2) -- none of
          # the four had ever been system-verified before their own
          # milestone added this row. A disagreement between this and
          # `ciac sim --target <x>`'s own green run is exactly the
          # fake/adapter bug this ratchet exists to catch. This row was
          # added speculatively in v0.24 M7 (ahead of Go's own sim
